version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    # image: aflah1026/care-bridge-frontend:v1
    container_name: carebridge-frontend
    ports:
      - "3000:3000"
    environment:
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - NODE_ENV=production
      - NEXT_PUBLIC_BACKEND_API_URL=http://backend:8080/api
    # depends_on:
    #   - backend
    # networks:
    #   - carebridge-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
